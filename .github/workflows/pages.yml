# The web page on GitHub Pages with the releases (docs/web.md, Releases). The repo's Pages source is "GitHub
# Actions", and its github-pages environment lets the tags v* deploy besides main (a release's run is on its tag). Nix on the runner builds the MCU firmware with Microchip's x86_64 toolchain, the OS
# image and the page, and pushes what it builds to the Cachix cache (vars.CACHIX_NAME, pawlowskialex-zd1; the token in
# secrets.CACHIX_AUTH_TOKEN), so later runs fetch what hasn't changed.
#
# A release (a tag v*, published on GitHub) gets its images and a `manifest.json` (from `zd1 image`) as assets: the MCU
# firmware, the system, the boot image, the Lightning model's .fw (its first install, through its BL2), and the system
# signed for the network update (docs/protocol/net.md) with the release key, the secret ZD1_RELEASE_KEY of the environment
# `release` (tags v* only; `zd1 keygen`; its public half is module/os/rootfs/etc/zd1/keys/release.pub, in the image); without the secret, no signed image. Then, and on every push to main, the site is rebuilt from EVERY published release: the page beside
# images/<version>/... and images/index.json, newest release first. Same origin: the page fetches nothing from the
# GitHub API and no image until it installs it.
name: pages
on:
  release: { types: [published] }
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  assets:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # the release key is the release environment's secret, which only tags v* may deploy from: a pull request's run
    # (refs/pull/..., a fork's or a branch's, whatever its workflow says) never gets it
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        if: ${{ vars.CACHIX_NAME != '' }}
        with: { name: "${{ vars.CACHIX_NAME }}", authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}" }
      - name: build the images
        env: { ZD1_RELEASE_KEY: "${{ secrets.ZD1_RELEASE_KEY }}" }
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          mkdir out
          cp "$(nix build .#mcu --print-out-paths)/zd1.hex" "out/zd1-$v.hex"
          os="$(nix build .#os-image --print-out-paths)"
          cp "$os/system.cpio.gz" "out/system-$v.cpio.gz"
          cp "$os/os.bcd" "out/os-$v.bcd"
          cp "$(nix build .#zd1l-fw --print-out-paths)/zd1l.fw" "out/zd1l-$v.fw"
          if [ -n "$ZD1_RELEASE_KEY" ]; then
            key="$RUNNER_TEMP/release.key"
            (umask 077 && printf '%s\n' "$ZD1_RELEASE_KEY" > "$key")
            nix run .#zd1 -- sign "out/system-$v.cpio.gz" --key "$key" -o "out/system-$v.signed"
            rm "$key"
          fi
          nix run .#zd1 -- image out/* > out/manifest.json
          cat out/manifest.json
      - name: attach them to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber

  # zd1-app for computers without nix (host/app, docs/web.md): zd1.app for any Mac and the Windows zip from nix (the
  # Intel half of zd1.app through Rosetta), the Flatpak for each Linux CPU from flatpak-builder in GNOME's SDK. Each
  # goes to the release as zd1-app-SYSTEM.EXT, unsigned, without the version: the README links
  # releases/latest/download/NAME. The site leaves them there.
  app:
    if: github.event_name == 'release'
    strategy:
      matrix:
        include:
          - { runner: macos-14, package: app-macos, file: macos.zip }
          - { runner: ubuntu-latest, package: app-windows, file: windows-x64.zip }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Rosetta, for zd1.app's Intel half
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: DeterminateSystems/nix-installer-action@v16
        with: { extra-conf: "extra-platforms = x86_64-darwin" }
      - uses: cachix/cachix-action@v15
        if: ${{ vars.CACHIX_NAME != '' }}
        with: { name: "${{ vars.CACHIX_NAME }}", authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}" }
      - name: build and attach
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -eu
          mkdir out
          cp "$(nix build .#${{ matrix.package }} --print-out-paths)"/*.zip "out/zd1-app-${{ matrix.file }}"
          gh release upload "$GITHUB_REF_NAME" out/* --clobber

  app-linux:
    if: github.event_name == 'release'
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    container: { image: "ghcr.io/flathub-infra/flatpak-github-actions:gnome-51", options: --privileged }
    steps:
      - uses: actions/checkout@v4
      - name: the Flatpak
        run: |
          set -eu
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --repo=repo --force-clean build \
            host/app/linux/io.github.pawlowskialex.zd1.yml
          mkdir out
          flatpak build-bundle repo "out/zd1-app-linux-${{ matrix.arch }}.flatpak" \
            io.github.pawlowskialex.zd1 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with: { name: "flatpak-${{ matrix.arch }}", path: out }

  app-linux-attach:
    needs: [app-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: flatpak-*, merge-multiple: true, path: out }
      - name: attach them to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"

  site:
    needs: [assets]
    if: always() && (needs.assets.result == 'success' || needs.assets.result == 'skipped')
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: cachix/cachix-action@v15
        if: ${{ vars.CACHIX_NAME != '' }}
        with: { name: "${{ vars.CACHIX_NAME }}", authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}" }
      - name: the page
        run: |
          mkdir site
          cp -r "$(nix build .#web --print-out-paths)/." site/
          chmod -R u+w site
      - name: the releases' images and the manifest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -eu
          mkdir -p site/images
          python3 - <<'PY'
          import json, os, subprocess
          rel = json.loads(subprocess.check_output(["gh", "release", "list", "--exclude-drafts", "--exclude-pre-releases",
                                                    "--json", "tagName,name,publishedAt,isLatest", "--limit", "50"]))
          rel.sort(key=lambda r: r["publishedAt"], reverse=True)
          out = []
          for r in rel:
              tag = r["tagName"]; v = tag.removeprefix("v"); d = os.path.join("site/images", v)
              # a release whose images aren't built yet (its own run still going) has no manifest: left out until then
              assets = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--json", "assets"]))["assets"]
              if not any(a["name"] == "manifest.json" for a in assets): continue
              # the images the manifest names, not the rest of the release (zd1-app's packages: the release's own)
              subprocess.check_call(["gh", "release", "download", tag, "--dir", d, "--clobber", "-p", "manifest.json"])
              names = [json.loads(l)["file"] for l in open(os.path.join(d, "manifest.json"))]
              subprocess.check_call(["gh", "release", "download", tag, "--dir", d, "--clobber"] + sum((["-p", n] for n in names), []))
              notes = subprocess.check_output(["gh", "release", "view", tag, "--json", "body", "--jq", ".body"], text=True).strip()
              e = {"version": v, "date": r["publishedAt"][:10], "notes": notes}
              for line in open(os.path.join(d, "manifest.json")):
                  j = json.loads(line); j["file"] = f"{v}/{j['file']}"; e[j.pop("kind")] = j
              out.append(e)
          json.dump({"releases": out}, open("site/images/index.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with: { path: site }
      # Pages takes a deployment for a commit it deployed before as that one: a release tagged on the commit main's run
      # deployed minutes earlier changed nothing (and actions/deploy-pages always names the deployment by GITHUB_SHA).
      # Its API calls, named by a commit of this run's own: GITHUB_SHA's tree on top of it, on no branch (Pages refuses
      # a version that is no commit of the repository: 404).
      - name: deploy
        id: deploy
        env: { GH_TOKEN: "${{ github.token }}", ARTIFACT_ID: "${{ steps.upload.outputs.artifact_id }}" }
        run: |
          set -eu
          oidc="$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          v="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" -f tree="$tree" -f "parents[]=$GITHUB_SHA" \
            -f message="The web page, run $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --jq .sha)"
          d="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$ARTIFACT_ID" \
            -f pages_build_version="$v" -f oidc_token="$oidc")"
          id="$(jq -r '.id // (.status_url | split("/") | last)' <<<"$d")"
          echo "page_url=$(jq -r .page_url <<<"$d")" >>"$GITHUB_OUTPUT"
          for _ in $(seq 120); do
            s="$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status)"
            echo "deployment $id: $s"
            case "$s" in
              succeed) exit 0 ;;
              deployment_failed | deployment_lost | deployment_content_failed | deployment_cancelled) exit 1 ;;
            esac
            sleep 5
          done
          echo "no final status in 10 minutes"
          exit 1
