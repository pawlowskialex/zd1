[package]
name = "zd1-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The web page in a window of its own: WebUSB and the speaker's local address done natively"

[[bin]]
name = "zd1-app"
path = "src/main.rs"

[dependencies]
zd1-host.workspace = true
# the window: the system's web view (WebKit on macOS and Linux, WebView2 on Windows)
tao = "0.37"
wry = "0.57"
# what the polyfill forwards: USB (nusb, as host/core), the speaker's WebSocket and BL2's plain HTTP
nusb = { version = "0.2.9", features = ["tokio"] }
ureq = { version = "3", default-features = false }
serde_json = "1"
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
dirs = "7"
mdns-sd = "0.21.6"
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
