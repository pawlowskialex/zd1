[package]
name = "zd1-netd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The network link: paired clients reach the speaker's host link over a WebSocket in a Noise session; the system update over the network"

[dependencies]
libc = "0.2"
sha2 = { version = "0.11", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zd1-hostlink.workspace = true
zd1-noise.workspace = true
zd1-release.workspace = true
zd1-settings.workspace = true
zd1-slot.workspace = true
zd1-sys.workspace = true
zd1-text.workspace = true
